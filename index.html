<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fbf8f3">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Organizador</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icono-192.png">
<link rel="apple-touch-icon" href="icono-192.png">
<style>
:root{
  color-scheme: light;
  --bg:#fbf8f3; --card:#ffffff; --txt:#2b2a33; --sub:#8d8a93; --linea:#efeae2;
  --acento:#5b7fd6; --raf:#5b7fd6; --lau:#d9719f; --dos:#9b8ad8;
  --verde:#4caf86; --naranja:#f0a35e; --rojo:#e07a6f;
  --radio:20px; --sombra:0 1px 2px rgba(60,40,20,.04),0 6px 18px rgba(60,40,20,.06);
}
/* Clara: la asistente */
.clara-top{display:flex;align-items:center;gap:12px;margin:6px 0 4px}
.avatar{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,#ffd6b8,#d9c8f5);display:grid;place-items:center;font-size:24px;flex:none;box-shadow:var(--sombra)}
.avatar.habla{animation:latido 1.1s ease-in-out infinite}
@keyframes latido{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.clara-top .quien{font-size:13px;color:var(--sub)}
.clara-top .nom{font-weight:600}
.saludo{font-size:30px;font-weight:700;letter-spacing:-.5px;margin:18px 0 2px;line-height:1.15}
.fecha-hoy{color:var(--sub);font-size:15px;margin-bottom:18px}
.escuchar{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:16px;border-radius:18px;background:linear-gradient(135deg,#ffe7d6,#ece4fb);font-size:17px;font-weight:600;color:var(--txt);box-shadow:var(--sombra);margin-bottom:18px}
.escuchar .ic{font-size:20px}
.burbuja{background:var(--card);border-radius:22px 22px 22px 6px;padding:20px;box-shadow:var(--sombra);font-size:18px;line-height:1.45;margin-bottom:12px}
.burbuja .chico{font-size:13px;color:var(--sub);margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
.burbuja .chico button{font-size:18px;padding:2px 6px}
.respuestas{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.resp{width:100%;padding:15px;border-radius:16px;background:var(--card);box-shadow:var(--sombra);font-size:16px;text-align:center}
.resp.pri{background:var(--acento);color:#fff;font-weight:600}
.puntos{display:flex;gap:6px;justify-content:center;margin:14px 0}
.puntos span{width:7px;height:7px;border-radius:50%;background:var(--linea)}
.puntos span.on{background:var(--acento)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:16px}
body{min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select,textarea{font:inherit;color:var(--txt)}
.envase{max-width:640px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 18px 24px}

/* Encabezado de cada pantalla */
.top{display:flex;align-items:flex-end;justify-content:space-between;margin:6px 0 18px}
.top h1{font-size:30px;font-weight:700;margin:0;letter-spacing:-.5px}
.top .chico{font-size:14px;color:var(--sub);margin-bottom:4px}
.yo{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--sub)}
.punto{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}

/* Selector Lo mío / Todo */
.seg{display:inline-flex;background:var(--linea);border-radius:12px;padding:3px;margin-bottom:14px}
.seg button{padding:7px 16px;border-radius:9px;font-size:14px;color:var(--sub)}
.seg button.on{background:var(--card);color:var(--txt);font-weight:600;box-shadow:var(--sombra)}

/* Tarjetas */
.lista{display:flex;flex-direction:column;gap:10px}
.item{background:var(--card);border-radius:var(--radio);padding:14px 16px;display:flex;align-items:center;gap:12px;box-shadow:var(--sombra);text-align:left;width:100%}
.item .cuerpo{flex:1;min-width:0}
.item .tit{font-size:16px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .det{font-size:13px;color:var(--sub);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .der{font-size:14px;color:var(--sub);flex:none;text-align:right}
.item.hecho .tit{text-decoration:line-through;color:var(--sub)}
.check{width:26px;height:26px;border-radius:50%;border:2px solid var(--linea);flex:none;display:grid;place-items:center}
.check.on{background:var(--verde);border-color:var(--verde)}
.check.on::after{content:"";width:7px;height:12px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.etq{display:inline-block;font-size:12px;padding:2px 8px;border-radius:20px;background:var(--linea);color:var(--txt);margin-left:6px;vertical-align:1px}
.etq.urg{background:#fde3e2;color:#b5332e}
.seccion{font-size:13px;font-weight:600;color:var(--sub);text-transform:uppercase;letter-spacing:.6px;margin:22px 4px 10px}
.vacio{text-align:center;color:var(--sub);padding:46px 20px;font-size:15px;line-height:1.5}
.vacio b{display:block;color:var(--txt);font-size:17px;margin-bottom:4px}
.grande{background:var(--card);border-radius:22px;padding:22px;box-shadow:var(--sombra);margin-bottom:12px}
.grande .num{font-size:38px;font-weight:700;letter-spacing:-1px}
.grande .lbl{color:var(--sub);font-size:14px;margin-top:2px}
.mas{display:block;width:100%;text-align:center;color:var(--acento);font-size:15px;padding:14px;margin-top:6px}

/* Barra de pestañas */
nav{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--linea);padding:6px 6px calc(6px + env(safe-area-inset-bottom));display:flex;justify-content:center;z-index:10}
nav .in{display:flex;width:100%;max-width:640px}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:11px;color:var(--sub)}
nav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--acento)}

/* Botón + */
.fab{position:fixed;right:20px;bottom:calc(84px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;background:var(--acento);color:#fff;font-size:32px;line-height:58px;text-align:center;box-shadow:0 6px 18px rgba(58,109,240,.35);z-index:11}
@media(min-width:700px){.fab{right:calc(50% - 300px)}}

/* Hoja inferior (formularios y detalle) */
.velo{position:fixed;inset:0;background:rgba(0,0,0,.32);z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
.velo.on{opacity:1;pointer-events:auto}
.hoja{position:fixed;left:0;right:0;bottom:0;max-width:640px;margin:0 auto;background:var(--bg);border-radius:24px 24px 0 0;z-index:21;padding:10px 18px calc(22px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .25s ease;max-height:92vh;overflow:auto}
.hoja.on{transform:none}
.agarre{width:40px;height:5px;border-radius:3px;background:var(--linea);margin:0 auto 14px}
.hoja h2{font-size:21px;margin:0 0 16px}
.campo{background:var(--card);border-radius:14px;padding:4px 14px;margin-bottom:10px}
.campo label{display:block;font-size:12px;color:var(--sub);padding-top:8px}
.campo input,.campo textarea,.campo select{width:100%;border:0;background:none;padding:4px 0 10px;outline:none;font-size:17px}
.fila{display:flex;gap:10px}.fila .campo{flex:1}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 12px}
.chips button{padding:9px 15px;border-radius:20px;background:var(--card);font-size:15px;box-shadow:var(--sombra)}
.chips button.on{background:var(--acento);color:#fff}
.chips .t{width:100%;font-size:12px;color:var(--sub);margin:2px 0 -2px 4px}
.btn{display:block;width:100%;padding:16px;border-radius:16px;background:var(--acento);color:#fff;font-size:17px;font-weight:600;margin-top:8px}
.btn.sec{background:var(--card);color:var(--txt);font-weight:500}
.btn.peligro{background:none;color:var(--rojo);font-weight:500}
.ver-mas{color:var(--acento);font-size:15px;padding:6px 4px 12px}
.oculto{display:none!important}
.dato{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--linea);font-size:16px}
.dato span:first-child{color:var(--sub)}
.dato a{color:var(--acento);text-decoration:none}
.hoja{visibility:hidden;transition:transform .25s ease,visibility 0s linear .25s}
.hoja.on{visibility:visible;transition:transform .25s ease,visibility 0s}

/* Pantalla ¿Quién entra? */
#quien{position:fixed;inset:0;background:var(--bg);z-index:30;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:14px;padding:24px}
#quien h1{font-size:28px;margin:0 0 14px}
#quien button{width:100%;max-width:320px;padding:20px;border-radius:20px;color:#fff;font-size:19px;font-weight:600}
.aviso{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--txt);color:var(--bg);padding:10px 18px;border-radius:20px;font-size:14px;z-index:40;opacity:0;transition:opacity .2s;pointer-events:none}
.aviso.on{opacity:.92}
</style>
</head>
<body>

<div id="quien">
  <h1>¿Quién entra?</h1>
  <button style="background:var(--raf)" onclick="entrar('Rafael')">Ángel Rafael</button>
  <button style="background:var(--lau)" onclick="entrar('Laura')">Laura Soledad</button>
</div>

<div class="envase" id="pantalla"></div>

<button class="fab" id="fab" onclick="abrirForm()">+</button>

<nav><div class="in" id="tabs"></div></nav>

<div class="velo" id="velo" onclick="cerrarHoja()"></div>
<div class="hoja" id="hoja"></div>
<div class="aviso" id="aviso"></div>

<script>
var SB = "https://dowtczgckcuvxwpgqcpq.supabase.co/rest/v1/";
var KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRvd3Rjemdja2N1dnh3cGdxY3BxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMyNzM1MjIsImV4cCI6MjEwODg0OTUyMn0.zN23LvcbY2BlMxe-kqp0MV8nucmY2bKV1foeqd6Vx8E";
var NOMBRE = {Rafael:"Ángel Rafael", Laura:"Laura Soledad", "Los dos":"Los dos"};
var COLOR = {Rafael:"var(--raf)", Laura:"var(--lau)", "Los dos":"var(--dos)"};
var ICON = {
  hoy:'<svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/><path d="M8.5 11h.01M12 11h.01M15.5 11h.01"/></svg>',
  agenda:'<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
  trabajo:'<svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-5h4v5"/></svg>',
  casa:'<svg viewBox="0 0 24 24"><path d="M9 11l3 3 8-8"/><path d="M20 12v6a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3V7a3 3 0 0 1 3-3h9"/></svg>',
  gasto:'<svg viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="13" rx="3"/><path d="M2 10h20M6 15h4"/></svg>'
};
var TABS = [["hoy","Clara"],["agenda","Agenda"],["trabajo","Trabajos"],["casa","Casa"],["gasto","Gastos"]];

var yo = leer("org-yo"), tab = leer("org-tab") || "hoy", filtro = leer("org-filtro") || "mio";
var items = [], eventos = [], verHechos = false;

function leer(k){try{return localStorage.getItem(k)}catch(e){return null}}
function guardar(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function aviso(t){var a=document.getElementById("aviso");a.textContent=t;a.classList.add("on");clearTimeout(aviso.t);aviso.t=setTimeout(function(){a.classList.remove("on")},1800)}

/* ---------- Datos ---------- */
function api(ruta, op){
  op = op || {};
  op.headers = {apikey:KEY, Authorization:"Bearer "+KEY, "Content-Type":"application/json", Prefer:"return=representation"};
  return fetch(SB+ruta, op).then(function(r){ if(!r.ok) throw new Error(r.status); return r.status==204?null:r.json(); });
}
function cargar(){
  var hace = new Date(Date.now()-86400000).toISOString();
  return Promise.all([
    api("org_items?select=*&order=fecha.asc.nullslast,creado.desc"),
    api("org_eventos?select=*&fin=gte."+encodeURIComponent(hace)+"&order=inicio.asc")
  ]).then(function(r){ items=r[0]||[]; eventos=r[1]||[]; pintar(); })
    .catch(function(){ aviso("Sin conexión. Reintentando…"); });
}

/* ---------- Fechas ---------- */
function hoyISO(){var d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)}
function sumar(iso,n){var d=new Date(iso+"T12:00:00");d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)}
var DIAS=["domingo","lunes","martes","miércoles","jueves","viernes","sábado"], MESES=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
function lindo(iso){
  if(!iso) return "";
  var h=hoyISO(); if(iso==h) return "Hoy"; if(iso==sumar(h,1)) return "Mañana"; if(iso==sumar(h,-1)) return "Ayer";
  var d=new Date(iso+"T12:00:00"); return DIAS[d.getDay()].replace(/^./,function(c){return c.toUpperCase()})+" "+d.getDate()+" de "+MESES[d.getMonth()];
}
function corto(iso){if(!iso)return"";var h=hoyISO();if(iso==h)return"Hoy";if(iso==sumar(h,1))return"Mañana";var d=new Date(iso+"T12:00:00");return d.getDate()+"/"+(d.getMonth()+1)}
function hhmm(t){return t?String(t).slice(0,5):""}
function plata(n){return "$ "+Math.round(Number(n)||0).toLocaleString("es-AR")}
function evDia(e){var d=new Date(e.inicio);d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return e.todo_el_dia?e.inicio.slice(0,10):d.toISOString().slice(0,10)}
function evHora(e){if(e.todo_el_dia)return"";var d=new Date(e.inicio);return("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2)}

function mio(it){return filtro=="todo"||it.quien==yo||it.quien=="Los dos"}

/* ---------- Pintar ---------- */
function pintar(){
  document.getElementById("tabs").innerHTML = TABS.map(function(t){
    return '<button class="'+(t[0]==tab?"on":"")+'" onclick="irA(\''+t[0]+'\')">'+ICON[t[0]]+t[1]+'</button>';
  }).join("");
  document.getElementById("fab").classList.toggle("oculto", tab=="agenda");
  var p = document.getElementById("pantalla");
  p.innerHTML = ({hoy:vHoy, agenda:vAgenda, trabajo:vTrabajos, casa:vCasa, gasto:vGastos})[tab]();
}
function irA(t){tab=t;guardar("org-tab",t);verHechos=false;pintar();window.scrollTo(0,0)}
function encab(titulo, chico){
  return '<div class="top"><div><div class="chico">'+(chico||"")+'</div><h1>'+titulo+'</h1></div>'+
    '<button class="yo" onclick="cambiarYo()"><span class="punto" style="background:'+COLOR[yo]+'"></span>'+yo+'</button></div>';
}
function seg(){
  return '<div class="seg"><button class="'+(filtro=="mio"?"on":"")+'" onclick="setFiltro(\'mio\')">Lo mío</button><button class="'+(filtro=="todo"?"on":"")+'" onclick="setFiltro(\'todo\')">Todo</button></div>';
}
function setFiltro(f){filtro=f;guardar("org-filtro",f);pintar()}

function tarjeta(it, soloHora){
  var det=[], der="";
  if(it.tipo=="trabajo"){ if(it.cliente) det.push(esc(it.cliente)); if(it.direccion) det.push(esc(it.direccion)); }
  if(it.tipo=="gasto"){ det.push(esc(it.categoria||"")); der='<b style="color:var(--txt)">'+plata(it.monto)+'</b>'; }
  if(it.fecha && it.tipo!="gasto") der = soloHora===true ? hhmm(it.hora) : corto(it.fecha)+(it.hora?"<br>"+hhmm(it.hora):"");
  if(it.tipo=="gasto" && it.fecha) det.push(corto(it.fecha));
  var urg = it.prioridad=="Urgente" && !it.hecho ? '<span class="etq urg">Urgente</span>' : "";
  var chk = it.tipo=="gasto" ? '<span class="punto" style="background:'+COLOR[it.quien]+'"></span>'
          : '<span class="check '+(it.hecho?"on":"")+'" onclick="event.stopPropagation();marcar(\''+it.id+'\')"></span>';
  return '<button class="item '+(it.hecho?"hecho":"")+'" onclick="detalle(\''+it.id+'\')">'+chk+
    '<div class="cuerpo"><div class="tit">'+esc(it.titulo)+urg+'</div>'+
    '<div class="det">'+(it.tipo!="gasto"?'<span class="punto" style="width:7px;height:7px;background:'+COLOR[it.quien]+'"></span> '+it.quien+(det.length?" · ":""):"")+det.join(" · ")+'</div></div>'+
    '<div class="der">'+der+'</div></button>';
}
function vacio(t,s){return '<div class="vacio"><b>'+t+'</b>'+s+'</div>'}

// Mezcla eventos del calendario y cosas del organizador de un mismo día, ordenados por hora
function delDia(evs, its){
  var filas = evs.map(function(e){return {h:evHora(e)||"00:00", html:'<div class="item"><span class="punto" style="background:var(--naranja)"></span><div class="cuerpo"><div class="tit">'+esc(e.titulo)+'</div><div class="det">Calendario Familia</div></div><div class="der">'+evHora(e)+'</div></div>'}})
    .concat(its.map(function(i){return {h:hhmm(i.hora)||"99:99", html:tarjeta(i,true)}}));
  filas.sort(function(a,b){return a.h<b.h?-1:a.h>b.h?1:0});
  return filas.map(function(f){return f.html}).join("");
}

/* ---------- Clara: la asistente ---------- */
var TEMAS = [];
function memo(){try{return JSON.parse(localStorage.getItem("org-clara-"+yo+"-"+hoyISO())||"{}")}catch(e){return {}}}
function memoSet(m){guardar("org-clara-"+yo+"-"+hoyISO(),JSON.stringify(m))}
function listaY(xs){return xs.length<2?(xs[0]||""):xs.slice(0,-1).join(", ")+" y "+xs[xs.length-1]}
function cosaHora(i){return (i.hora?hhmm(i.hora)+" ":"")+i.titulo+(i.cliente?" ("+i.cliente+")":"")}
function evTexto(e){var h=evHora(e);return (h?"a las "+h+" ":"")+e.titulo}
function esMia(i){return i.quien==yo||i.quien=="Los dos"}
function puedeAvisar(){return "serviceWorker" in navigator && "PushManager" in window && "Notification" in window}
function enPantalla(){return window.matchMedia&&window.matchMedia("(display-mode: standalone)").matches||navigator.standalone}

function armarTemas(){
  var h=hoyISO(), man=sumar(h,1), hora=new Date().getHours(), T=[];
  var mias=items.filter(function(i){return i.tipo!="gasto"&&!i.hecho&&esMia(i)});
  var deHoy=mias.filter(function(i){return i.fecha==h}).sort(function(a,b){return (hhmm(a.hora)||"99")<(hhmm(b.hora)||"99")?-1:1});
  var atras=mias.filter(function(i){return i.fecha&&i.fecha<h});
  var evH=eventos.filter(function(e){return evDia(e)==h&&!items.some(function(i){return i.gcal_id==e.id})});
  var evM=eventos.filter(function(e){return evDia(e)==man&&!items.some(function(i){return i.gcal_id==e.id})});
  var deMan=mias.filter(function(i){return i.fecha==man});

  if(leer("org-push")!=yo){
    if(puedeAvisar() && (!("Notification" in window) || Notification.permission!="denied"))
      T.push({id:"avisos",txt:"Para ayudarte mejor, ¿querés que te avise a la mañana, media hora antes de cada cosa y a la noche?",
        bt:[["Sí, avisame",true,function(){activarAvisos()}],["Ahora no",false,"despues24"]]});
    else if(!puedeAvisar() && !enPantalla())
      T.push({id:"instalar",txt:"Un consejo: agregá esta app a la pantalla de inicio del celu (menú ⋮, \"Agregar a la pantalla principal\"). Así la abrís con un toque y te puedo mandar avisos.",
        bt:[["Entendido",true,"ok"]]});
  }
  if(evH.length) T.push({id:"familia",txt:"Hoy en la familia: "+listaY(evH.map(evTexto))+".",bt:[["Entendido",true,"ok"]]});
  atras.slice(0,3).forEach(function(i){
    T.push({id:"atras-"+i.id,txt:yo+", quedó pendiente del "+lindo(i.fecha).toLowerCase()+": «"+i.titulo+"». ¿Ya lo hiciste?",
      bt:[["Sí, ya está ✓",true,function(){hecho(i.id)}],["Pasarlo a hoy",false,function(){moverA(i.id,h)}],["Lo veo después",false,"despues"]]});
  });
  if(hora>=19){
    deHoy.slice(0,3).forEach(function(i){
      T.push({id:"noche-"+i.id,txt:"¿Pudiste hacer «"+i.titulo+"»?",
        bt:[["Sí ✓",true,function(){hecho(i.id)}],["Pasarlo a mañana",false,function(){moverA(i.id,man)}],["Después te cuento",false,"despues"]]});
    });
  } else if(deHoy.length){
    T.push({id:"hoy",txt:"Para hoy "+(deHoy.length==1?"tenés una cosa: ":"tenés "+deHoy.length+" cosas: ")+listaY(deHoy.map(cosaHora))+".",
      bt:[["Ver la agenda",true,function(){irA("agenda")}],["Entendido",false,"ok"]]});
  } else {
    T.push({id:"libre",txt:"Hoy no tenés nada anotado. ¿Querés anotar algo para no olvidarte?",
      bt:[["Anotar algo",true,function(){abrirForm(null,"casa")}],["No, gracias",false,"ok"]]});
  }
  var yaDichos=atras.slice(0,3).concat(deHoy);
  var urg=items.filter(function(i){return i.tipo=="casa"&&!i.hecho&&i.prioridad=="Urgente"&&esMia(i)&&yaDichos.indexOf(i)<0});
  if(urg.length) T.push({id:"urgentes",txt:"En la casa hay "+(urg.length==1?"algo urgente: ":urg.length+" cosas urgentes: ")+listaY(urg.slice(0,3).map(function(i){return i.titulo}))+(urg.length==1?". ¿Lo vemos?":". ¿Las vemos?"),
      bt:[["Sí, vamos",true,function(){irA("casa")}],["Más tarde",false,"despues"]]});
  var saldo=items.filter(function(i){return i.tipo=="trabajo"&&esMia(i)&&Number(i.monto)>0}).reduce(function(s,i){return s+(Number(i.monto)||0)-(Number(i.cobrado)||0)},0);
  if(saldo>0) T.push({id:"cobrar",txt:"Falta cobrar "+plata(saldo)+" de trabajos. ¿Querés revisarlo?",bt:[["Ver trabajos",true,function(){irA("trabajo")}],["Más tarde",false,"despues"]]});
  if(evM.length||deMan.length) T.push({id:"manana",txt:"Mañana: "+listaY(evM.map(evTexto).concat(deMan.map(cosaHora)))+".",bt:[["Entendido",true,"ok"]]});
  if(hora>=12 && !items.some(function(i){return i.tipo=="gasto"&&i.fecha==h&&i.quien==yo}))
    T.push({id:"gasto",txt:"¿Gastaste algo hoy? Si lo anotás ahora, después no se olvida.",bt:[["Anotar un gasto",true,function(){abrirForm(null,"gasto")}],["Hoy no",false,"ok"]]});
  return T;
}
function saludo(){var h=new Date().getHours();return (h<12?"Buen día":h<19?"Buenas tardes":"Buenas noches")+", "+yo+"."}
function fechaLarga(){var d=new Date();return DIAS[d.getDay()].replace(/^./,function(c){return c.toUpperCase()})+" "+d.getDate()+" de "+MESES[d.getMonth()]}
function pendientes(){var m=memo(),ahora=Date.now();return TEMAS.filter(function(t){var v=m[t.id];return !v||(typeof v=="number"&&v<ahora)})}

function vHoy(){
  TEMAS=armarTemas();
  var pend=pendientes(), t=pend[0];

    '<span style="flex:1"></span><button class="yo" onclick="cambiarYo()"><span class="punto" style="background:'+COLOR[yo]+'"></span>'+yo+'</button></div>';
  html+='<div class="saludo">'+saludo()+'</div><div class="fecha-hoy">'+fechaLarga()+'</div>';
  html+='<button class="escuchar" onclick="escucharTodo()"><span class="ic">🔊</span> Escuchar el resumen</button>';
  if(t){

    html+='<div class="respuestas">'+t.bt.map(function(b,j){return '<button class="resp'+(b[1]?" pri":"")+'" onclick="responder('+i+','+j+')">'+esc(b[0])+'</button>'}).join("")+'</div>';
    html+='<div class="puntos">'+pend.map(function(x,k){return '<span class="'+(k==0?"on":"")+'"></span>'}).join("")+'</div>';
  } else {
    html+='<div class="burbuja"><div class="chico"><span>Clara</span></div>Eso es todo por ahora, '+yo+'. '+(new Date().getHours()>=19?"¡Que descanses!":"¡Que tengas un buen día!")+' Cuando quieras, tocá + para anotar algo.</div>';
    html+='<button class="mas" onclick="memoSet({});pintar()">Repasar de nuevo</button>';
  }
  return html;

function responder(i,j){
  var t=TEMAS[i], b=t.bt[j], m=memo();
  m[t.id] = b[2]=="despues"?Date.now()+3*3600000 : b[2]=="despues24"?Date.now()+86400000 : 1;
  memoSet(m);
  if(typeof b[2]=="function") b[2]();
  pintar();
  var sig=pendientes()[0]; if(hablando && sig) hablar(sig.txt);
}
function hecho(id){var it=buscar(id); if(it&&!it.hecho) marcar(id)}
function moverA(id,fecha){
  var it=buscar(id); if(!it) return; it.fecha=fecha;
  var d={fecha:fecha}; if(it.gcal_id&&it.gcal_id!="hecho") d.gcal_id="cambiar:"+it.gcal_id.replace(/^cambiar:/,"");
  aviso(fecha==hoyISO()?"Pasado a hoy":"Pasado a mañana");
  api("org_items?id=eq."+id,{method:"PATCH",body:JSON.stringify(d)}).catch(function(){aviso("No se pudo guardar");cargar()});
}

/* ---------- Voz ---------- */
var voz=null, hablando=false;
function elegirVoz(){
  if(!("speechSynthesis" in window)) return null;
  var vs=speechSynthesis.getVoices().filter(function(v){return /^es/i.test(v.lang)});
  var mujer=/paulina|m[oó]nica|helena|sabina|laura|elvira|dalia|camila|paloma|elena|luc[ií]a|sof[ií]a|isabela|valentina|female|mujer/i;
  var orden=function(v){return (mujer.test(v.name)?0:4)+(/AR|419|US|MX/.test(v.lang)?0:1)+(/google|natural|online/i.test(v.name)?0:2)};
  vs.sort(function(a,b){return orden(a)-orden(b)});
  return vs[0]||null;
}
if("speechSynthesis" in window){speechSynthesis.onvoiceschanged=function(){voz=elegirVoz()};voz=elegirVoz()}
function hablar(txt, alTerminar){
  if(!("speechSynthesis" in window)){aviso("Este celular no tiene voz disponible");return}
  speechSynthesis.cancel();
  var u=new SpeechSynthesisUtterance(txt.replace(/[«»✓]/g,"").replace(/\$ ?([\d.]+)/g,"$1 pesos"));
  u.lang=voz?voz.lang:"es-AR"; if(voz) u.voice=voz; u.rate=0.95; u.pitch=1.08;
  var av=document.getElementById("avatar"); if(av) av.classList.add("habla");
  u.onend=u.onerror=function(){var a=document.getElementById("avatar"); if(a) a.classList.remove("habla"); if(alTerminar) alTerminar()};
  speechSynthesis.speak(u);
}
function escucharTodo(){
  hablando=true;
  var p=pendientes(), txt=saludo()+" Hoy es "+fechaLarga()+". ";
  txt += p.length ? p.map(function(t){return t.txt}).join(" ") + " Si querés, lo vamos viendo de a uno acá abajo." : "No tengo nada nuevo para contarte. ¡Que tengas un lindo día!";
  hablar(txt,function(){hablando=false});
}

/* ---------- Avisos al celular ---------- */
var FN_AVISOS="https://dowtczgckcuvxwpgqcpq.supabase.co/functions/v1/org-avisos";
function b64(s){var p="=".repeat((4-s.length%4)%4),r=atob((s+p).replace(/-/g,"+").replace(/_/g,"/")),o=new Uint8Array(r.length);for(var i=0;i<r.length;i++)o[i]=r.charCodeAt(i);return o}
function activarAvisos(){
  if(!puedeAvisar()){aviso("Este celular no permite avisos desde el navegador");return}
  Notification.requestPermission().then(function(p){

    return Promise.all([navigator.serviceWorker.ready, fetch(FN_AVISOS).then(function(r){return r.json()})]).then(function(r){
      return r[0].pushManager.subscribe({userVisibleOnly:true, applicationServerKey:b64(r[1].pub)});
    }).then(function(sub){
      return fetch(FN_AVISOS,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({suscribir:{persona:yo,sub:sub.toJSON()}})});
    }).then(function(r){if(!r.ok)throw 0; guardar("org-push",yo); aviso("¡Listo! Te voy a avisar 🔔")});
  }).catch(function(){aviso("No se pudieron activar los avisos")});
}

function vAgenda(){
  var h=hoyISO(), html=encab("Agenda","Próximas 2 semanas")+seg(), algo=false;
  var sinFecha = items.filter(function(i){return i.tipo!="gasto"&&!i.hecho&&!i.fecha&&mio(i)});
  var atras = items.filter(function(i){return i.tipo!="gasto"&&!i.hecho&&i.fecha&&i.fecha<h&&mio(i)});
  if(atras.length){algo=true;html+='<div class="seccion" style="color:var(--rojo)">Atrasado</div><div class="lista">'+atras.map(tarjeta).join("")+'</div>'}
  for(var n=0;n<14;n++){
    var dia=sumar(h,n);
    var its=items.filter(function(i){return i.tipo!="gasto"&&!i.hecho&&i.fecha==dia&&mio(i)});
    var evs=eventos.filter(function(e){return evDia(e)==dia && !items.some(function(i){return i.gcal_id==e.id})});
    if(!its.length&&!evs.length) continue;
    algo=true;
    html+='<div class="seccion">'+lindo(dia)+'</div><div class="lista">'+delDia(evs, its)+'</div>';
  }
  if(sinFecha.length){algo=true;html+='<div class="seccion">Sin fecha</div><div class="lista">'+sinFecha.map(tarjeta).join("")+'</div>'}
  if(!algo) html+=vacio("Nada en agenda","Lo que cargues con fecha aparece acá y en el calendario Familia.");
  return html;
}

function vLista(tipo, titulo, vacioTxt){
  var todos = items.filter(function(i){return i.tipo==tipo&&mio(i)});
  var abiertos = todos.filter(function(i){return !i.hecho}), hechos = todos.filter(function(i){return i.hecho});
  var html = encab(titulo, abiertos.length+(abiertos.length==1?" pendiente":" pendientes"))+seg();
  html += abiertos.length ? '<div class="lista">'+abiertos.map(tarjeta).join("")+'</div>' : vacio("Todo al día", vacioTxt);
  if(hechos.length){
    html += '<button class="mas" onclick="verHechos=!verHechos;pintar()">'+(verHechos?"Ocultar":"Ver")+' terminados ('+hechos.length+')</button>';
    if(verHechos) html += '<div class="lista">'+hechos.slice(0,40).map(tarjeta).join("")+'</div>';
  }
  return html;
}
function vTrabajos(){return vLista("trabajo","Trabajos","Tocá + para cargar un trabajo o cliente.")}
function vCasa(){return vLista("casa","Casa","Tocá + para anotar algo de la casa.")}
function vGastos(){
  var mes=hoyISO().slice(0,7);
  var g=items.filter(function(i){return i.tipo=="gasto"&&mio(i)});
  var delMes=g.filter(function(i){return (i.fecha||"").slice(0,7)==mes});
  var total=delMes.reduce(function(s,i){return s+(Number(i.monto)||0)},0);

  html+='<div class="grande"><div class="num">'+plata(total)+'</div><div class="lbl">gastado este mes</div></div>';
  html+= delMes.length ? '<div class="lista">'+delMes.slice().reverse().map(tarjeta).join("")+'</div>' : vacio("Sin gastos este mes","Tocá + para anotar uno.");
  return html;
}

/* ---------- Acciones ---------- */
function buscar(id){return items.find(function(i){return i.id==id})}
function marcar(id){
  var it=buscar(id); it.hecho=!it.hecho; pintar();
  if(it.hecho) aviso("Listo ✓");
  api("org_items?id=eq."+id,{method:"PATCH",body:JSON.stringify({hecho:it.hecho})}).catch(function(){aviso("No se pudo guardar");cargar()});
}
function borrar(id){
  if(!document.getElementById("conf-borrar")){ var b=document.getElementById("btn-borrar"); b.textContent="Tocá de nuevo para borrar"; b.id="conf-borrar"; return; }
  items=items.filter(function(i){return i.id!=id}); cerrarHoja(); pintar(); aviso("Borrado");
  api("org_items?id=eq."+id,{method:"DELETE"}).catch(function(){aviso("No se pudo borrar");cargar()});
}

function abrirHoja(html){var h=document.getElementById("hoja");h.innerHTML='<div class="agarre"></div>'+html;h.classList.add("on");document.getElementById("velo").classList.add("on")}
function cerrarHoja(){document.getElementById("hoja").classList.remove("on");document.getElementById("velo").classList.remove("on")}

function detalle(id){
  var it=buscar(id), f=[];
  function d(a,b){if(b)f.push('<div class="dato"><span>'+a+'</span><span>'+b+'</span></div>')}
  d("Quién",NOMBRE[it.quien]);
  d("Fecha",it.fecha?lindo(it.fecha)+(it.hora?" · "+hhmm(it.hora):""):"");
  d("Cliente",esc(it.cliente));
  if(it.telefono) d("Teléfono",'<a href="tel:'+esc(it.telefono)+'">'+esc(it.telefono)+'</a> · <a href="https://wa.me/'+esc(String(it.telefono).replace(/\D/g,""))+'">WhatsApp</a>');
  if(it.direccion) d("Dirección",'<a href="https://maps.google.com/?q='+encodeURIComponent(it.direccion+", La Plata")+'">'+esc(it.direccion)+'</a>');
  d("Estado",esc(it.estado));
  if(it.tipo=="trabajo"&&it.monto){d("Presupuesto",plata(it.monto));d("Cobrado",plata(it.cobrado));d("Falta cobrar",plata((Number(it.monto)||0)-(Number(it.cobrado)||0)))}
  if(it.tipo=="gasto"){d("Monto",plata(it.monto));d("Categoría",esc(it.categoria))}
  d("Prioridad",it.prioridad=="Urgente"?"Urgente":"");
  d("Notas",esc(it.notas));
  var cal = "";
  if(it.fecha && it.tipo!="gasto"){
    var f0=it.fecha.replace(/-/g,""), fechas;
    if(it.hora){var hh=hhmm(it.hora).replace(":",""), h1=("0"+((parseInt(hh.slice(0,2),10)+1)%24)).slice(-2)+hh.slice(2); fechas=f0+"T"+hh+"00/"+f0+"T"+h1+"00";}
    else fechas=f0+"/"+sumar(it.fecha,1).replace(/-/g,"");
    var tit=it.titulo+(it.cliente?" – "+it.cliente:"")+" ("+it.quien+")";
    var url="https://calendar.google.com/calendar/render?action=TEMPLATE&text="+encodeURIComponent(tit)+"&dates="+fechas+"&ctz=America/Argentina/Buenos_Aires&src="+encodeURIComponent("family14446676083126153301@group.calendar.google.com")+
      (it.direccion?"&location="+encodeURIComponent(it.direccion):"")+"&details="+encodeURIComponent("Cargado desde el Organizador"+(it.telefono?"\nTel: "+it.telefono:"")+(it.notas?"\n"+it.notas:""));
    cal = it.gcal_id ? "" : '<a class="btn sec" style="text-align:center;text-decoration:none" target="_blank" href="'+url+'">Pasar al calendario Familia</a>';
  }
  d("En calendario",it.fecha&&it.tipo!="gasto"?(it.gcal_id?"Sí":"Todavía no"):"");
  abrirHoja('<h2>'+esc(it.titulo)+'</h2>'+f.join("")+
    (it.tipo!="gasto"?'<button class="btn" onclick="marcar(\''+id+'\');cerrarHoja()">'+(it.hecho?"Volver a pendiente":"Marcar como hecho")+'</button>':"")+
    cal+
    '<button class="btn sec" onclick="abrirForm(\''+id+'\')">Editar</button>'+
    '<button class="btn peligro" id="btn-borrar" onclick="borrar(\''+id+'\')">Borrar</button>');
}

/* ---------- Formulario ---------- */
var F = {};
function chips(nombre, opciones, titulo){
  return '<div class="chips"><div class="t">'+titulo+'</div>'+opciones.map(function(o){
    return '<button type="button" class="'+(F[nombre]==o?"on":"")+'" onclick="F.'+nombre+'=\''+o+'\';this.parentNode.querySelectorAll(\'button\').forEach(function(b){b.classList.remove(\'on\')});this.classList.add(\'on\')">'+(nombre=="quien"?o:o)+'</button>';
  }).join("")+'</div>';
}
function campo(id,label,tipo,valor,extra){return '<div class="campo"><label for="f-'+id+'">'+label+'</label><input id="f-'+id+'" type="'+tipo+'" value="'+esc(valor||"")+'" '+(extra||"")+'></div>'}

function abrirForm(id, tipoF){
  var it = id ? buscar(id) : null, tipo = it ? it.tipo : (tipoF || (tab=="hoy"?"casa":tab));
  if(tipo=="agenda") tipo="casa";
  F = {id:id||null, tipo:tipo, quien: it?it.quien:(tipo=="gasto"?yo:yo), categoria: it?it.categoria:"Casa", prioridad: it&&it.prioridad=="Urgente"?"Urgente":"Normal"};
  var h = '<h2>'+(it?"Editar":({trabajo:"Nuevo trabajo",casa:"Nueva tarea",gasto:"Nuevo gasto"})[tipo])+'</h2>';
  if(!it && tab=="hoy") h = '<div class="seg" style="margin-bottom:16px">'+[["casa","Tarea"],["trabajo","Trabajo"],["gasto","Gasto"]].map(function(t){return '<button class="'+(t[0]==tipo?"on":"")+'" onclick="cambiarTipoForm(\''+t[0]+'\')">'+t[1]+'</button>'}).join("")+'</div>';
  if(tipo=="trabajo"){
    h += campo("titulo","¿Qué trabajo?","text",it&&it.titulo,'placeholder="Ej: cambiar canaletas"');
    h += campo("cliente","Cliente","text",it&&it.cliente);
    h += '<div class="fila">'+campo("fecha","Día","date",it&&it.fecha)+campo("hora","Hora","time",it&&hhmm(it.hora))+'</div>';
    h += chips("quien",["Rafael","Laura","Los dos"],"¿Quién?");
    h += '<div id="mas-campos" class="oculto">'+campo("telefono","Teléfono","tel",it&&it.telefono)+campo("direccion","Dirección","text",it&&it.direccion)+
         '<div class="fila">'+campo("monto","Presupuesto $","number",it&&it.monto,'inputmode="numeric"')+campo("cobrado","Cobrado $","number",it&&it.cobrado,'inputmode="numeric"')+'</div>'+
         campo("notas","Notas","text",it&&it.notas)+'</div>';
    h += '<button class="ver-mas" id="ver-mas" onclick="document.getElementById(\'mas-campos\').classList.remove(\'oculto\');this.remove()">+ Teléfono, dirección, plata y notas</button>';
  } else if(tipo=="casa"){
    h += campo("titulo","¿Qué hay que hacer?","text",it&&it.titulo,'placeholder="Ej: pagar la luz"');
    h += chips("quien",["Rafael","Laura","Los dos"],"¿Quién?");
    h += chips("prioridad",["Normal","Urgente"],"¿Es urgente?");
    h += '<div class="fila">'+campo("fecha","Día (opcional)","date",it&&it.fecha)+campo("hora","Hora","time",it&&hhmm(it.hora))+'</div>';
    h += '<div id="mas-campos" class="oculto">'+campo("notas","Notas","text",it&&it.notas)+'</div>';
    h += '<button class="ver-mas" onclick="document.getElementById(\'mas-campos\').classList.remove(\'oculto\');this.remove()">+ Notas</button>';
  } else {
    h += campo("titulo","¿En qué?","text",it&&it.titulo,'placeholder="Ej: supermercado"');
    h += campo("monto","Monto $","number",it&&it.monto,'inputmode="numeric"');
    h += chips("categoria",["Casa","Obra","Personal"],"Categoría");
    h += chips("quien",["Rafael","Laura","Los dos"],"¿Quién pagó?");
    h += campo("fecha","Día","date",it?it.fecha:hoyISO());
  }
  h += '<button class="btn" onclick="guardarForm()">Guardar</button><button class="btn sec" onclick="cerrarHoja()">Cancelar</button>';
  abrirHoja(h);
  setTimeout(function(){var t=document.getElementById("f-titulo"); if(t&&!id) t.focus()},260);
}
function cambiarTipoForm(t){tab_backup=tab;var vieja=tab;tab=t;abrirForm();tab=vieja;}
var tab_backup;
function val(id){var e=document.getElementById("f-"+id);return e&&e.value.trim()?e.value.trim():null}
function guardarForm(){
  var titulo=val("titulo"); if(!titulo){aviso("Escribí qué es");return}
  var d={tipo:F.tipo, quien:F.quien||yo, titulo:titulo, fecha:val("fecha"), hora:val("hora"), notas:val("notas")};
  if(F.tipo=="trabajo"){d.cliente=val("cliente");d.telefono=val("telefono");d.direccion=val("direccion");d.monto=val("monto");d.cobrado=val("cobrado");if(!F.id)d.estado="Pendiente"}
  if(F.tipo=="casa"){d.prioridad=F.prioridad}
  if(F.tipo=="gasto"){d.monto=val("monto");d.categoria=F.categoria;if(!d.monto){aviso("Poné el monto");return}}
  // Si cambió la fecha u hora, el calendario se vuelve a sincronizar
  if(F.id){var viejo=buscar(F.id); if(viejo&&(viejo.fecha!=d.fecha||hhmm(viejo.hora)!=hhmm(d.hora)||viejo.titulo!=d.titulo)) d.gcal_id = viejo.gcal_id ? "cambiar:"+viejo.gcal_id.replace(/^cambiar:/,"") : null;}
  else d.creado_por=yo;
  cerrarHoja(); aviso("Guardado ✓");
  var p = F.id ? api("org_items?id=eq."+F.id,{method:"PATCH",body:JSON.stringify(d)}) : api("org_items",{method:"POST",body:JSON.stringify(d)});
  p.then(cargar).catch(function(){aviso("No se pudo guardar. Revisá la conexión")});
  if(!F.id && tab=="hoy" && F.tipo!="casa"){} // se queda en Hoy
}
